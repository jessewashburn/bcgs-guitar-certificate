name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'SDD.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Fetch performer roster from private data repo
        env:
          EVAL_PAT: ${{ secrets.EVAL_PAT }}
        run: |
          if [ -z "$EVAL_PAT" ]; then
            echo "::error::Repository secret EVAL_PAT is not set."
            exit 1
          fi
          http_status=$(curl -sS -o performers.json -w '%{http_code}' \
            -H "Authorization: token $EVAL_PAT" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/jessewashburn/bcgs-evaluations-data/contents/performers.json")
          if [ "$http_status" != "200" ]; then
            echo "::error::Could not fetch performers.json from data repo (HTTP $http_status). Body:"
            cat performers.json
            exit 1
          fi
          if ! python3 -c "import json,sys; json.load(open('performers.json'))" 2>/dev/null; then
            echo "::error::performers.json is not valid JSON."
            cat performers.json
            exit 1
          fi

      - name: Inject roster and PAT into index.html
        env:
          EVAL_PAT: ${{ secrets.EVAL_PAT }}
        run: |
          for placeholder in __PERFORMERS__ __GH_TOKEN__; do
            if ! grep -q "$placeholder" _site/index.html; then
              echo "::error::Placeholder $placeholder not found in index.html."
              exit 1
            fi
          done
          python3 - <<'PY'
          import os, pathlib
          html = pathlib.Path('_site/index.html').read_text()
          roster = pathlib.Path('performers.json').read_text().strip()
          html = html.replace('__PERFORMERS__', roster)
          html = html.replace('__GH_TOKEN__', os.environ['EVAL_PAT'])
          pathlib.Path('_site/index.html').write_text(html)
          PY

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
